<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字对决</title><style>*{box-sizing:border-box}body{margin:0;background:#eff6fc;color:#263b50;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 16px}h1{color:#367acb;margin-bottom:4px}small{color:#70859b}section{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 24px #325d8510}input,button{font:inherit;border-radius:12px;padding:13px;width:100%;margin:6px 0}input{border:1px solid #cbddec;background:#f9fcff}button{border:0;background:#4389df;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#e8f2ff;color:#367acb}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timer{font-size:48px;color:#4389df;text-align:center;font-variant-numeric:tabular-nums}.center{text-align:center}.record{padding:10px 0;border-bottom:1px solid #e9eff5;overflow-wrap:anywhere}.secret{letter-spacing:4px;font-size:24px}.err{color:#b34b4b;min-height:24px}h3{font-size:16px}</style><main><h1>数字对决</h1><small>一点推理，一点运气。</small><div class="cols"><button class="alt" id="music" onclick="toggleAudio('music')">音乐：关</button><button class="alt" id="fx" onclick="toggleAudio('fx')">音效：开</button></div><section id="home"><input id="nick" maxlength="20" placeholder="你的昵称"><button onclick="enter('create')">创建房间</button><input id="code" inputmode="numeric" maxlength="6" placeholder="六位房间号"><button class="alt" onclick="enter('join')">加入房间</button></section><div id="game" hidden><section><small>房间号</small><h2 id="room"></h2><button class="alt" onclick="share()">复制邀请链接</button><div id="players"></div></section><section id="stage"></section><section id="records" hidden><div class="cols"><div><h3>我的记录</h3><div id="mine"></div></div><div><h3>对方记录</h3><div id="other"></div></div></div></section><button class="alt" onclick="leave()">退出房间</button></div><p class="err" id="err" role="alert"></p></main><script>
const $=id=>document.getElementById(id);let session=JSON.parse(localStorage.getItem('duel')||'null'),state=null,key='',busy=false,epoch=0; $('code').value=new URLSearchParams(location.search).get('room')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,extra={}){let r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,action,...extra})});let j=await r.json();if(j.error)throw Error(j.error);return j}async function enter(action){if(busy)return;busy=true;try{session=await api(action,{name:$('nick').value,code:$('code').value});localStorage.setItem('duel',JSON.stringify(session));key='';}catch(e){$('err').textContent=e.message}finally{busy=false}poll()}async function act(action,value){if(busy)return;busy=true;try{render(await api(action,{value}));$('err').textContent=''}catch(e){$('err').textContent=e.message}finally{busy=false}}function leave(){if(!confirm('退出当前房间？'))return;epoch++;session=null;localStorage.removeItem('duel');location.href=location.pathname}async function share(){let u=new URL(location.href);u.searchParams.set('room',session.code);try{await navigator.clipboard.writeText(u.href);$('err').textContent='邀请链接已复制'}catch{prompt('复制邀请链接',u.href)}}function render(s){audioUpdate(s,state);state=s;$('home').hidden=true;$('game').hidden=false;$('room').textContent=session.code;$('players').innerHTML=s.players.map((p,i)=>esc(p.name)+(i===s.me?'（我）':'')+' · '+(s.phase==='size'?(p.size??'未选')+' 位':p.ready?'已准备':'未准备')).join('<br>');let p=s.players[s.me],k=[s.phase,s.turn,p.ready,p.again,p.size,s.players.length,s.rps_round,s.rps_ready,s.pending_hit,s.history.length].join('|');if(k!==key){key=k;let h='';if(s.phase==='size')h='<h2>选择数字位数</h2><p>双方选择一致后开始设置谜底。</p><input id="value" type="number" min="1" max="12" value="'+(p.size||4)+'"><button onclick="act(\'size\',$(\'value\').value)">确认位数</button>';if(s.phase==='secret')h=p.ready?'<h2>等待对方准备</h2>':'<h2>设置你的秘密数字</h2><input id="value" inputmode="numeric" maxlength="'+p.size+'" autocomplete="off" placeholder="输入 '+p.size+' 位数字"><button onclick="act(\'secret\',$(\'value\').value)">锁定谜底</button>';if(s.phase==='play')h='<div class="timer" id="timer"></div><h2 class="center">'+(s.turn===s.me?'轮到你猜啦！':'等待对方猜测')+'</h2>'+(s.turn===s.me?'<input id="value" inputmode="numeric" autocomplete="off" maxlength="'+p.size+'" placeholder="输入 '+p.size+' 位数字"><button onclick="act(\'guess\',$(\'value\').value)">提交猜测</button>':'');if(s.phase==='rps')h='<h2>石头剪刀布 · 第 '+s.rps_round+' 局</h2><p>双方同轮猜中！秘密出拳，平局重赛。</p>'+ (s.rps_last?'<p>上局平局：'+hand(s.rps_last[0])+'</p>':'')+(s.rps_ready?'<p>等待对方出拳…</p>':'<div class="cols">'+['rock','scissors','paper'].map(v=>'<button onclick="act(\'rps\',\''+v+'\')">'+hand(v)+'</button>').join('')+'</div>');if(s.phase==='play'&&s.pending_hit)h+='<p>先手已猜中，等待后手完成本轮。</p>';if(s.phase==='end')h='<h2>'+ (s.winner===s.me?'🎉 你赢啦！':'本局对方获胜')+'</h2>'+s.players.map(q=>'<p>'+esc(q.name)+'：'+esc(q.secret)+'</p>').join('')+(s.rps_last?'<p>决胜出拳：'+s.players.map((q,i)=>esc(q.name)+' '+hand(s.rps_last[i])).join(' · ')+'</p>':'')+'<button '+(p.again?'disabled':'')+' onclick="act(\'again\')">'+(p.again?'等待对方':'再来一局')+'</button>';if(p.secret&&s.phase!=='end')h+='<p><small>我的秘密数字</small></p><div class="secret">'+esc(p.secret)+'</div>';$('stage').innerHTML=h}if($('timer'))$('timer').textContent=Math.ceil(s.remaining)+' 秒';$('records').hidden=!['play','rps','end'].includes(s.phase);for(let i=0;i<2;i++)$(i===s.me?'mine':'other').innerHTML=s.history.filter(x=>x[0]===i).map((x,j)=>'<div class="record">'+(j+1)+'. '+(x[1]===null?'超时 · 跳过':esc(x[1])+' · '+x[2]+' 位正确')+'</div>').join('')||'<small>暂无记录</small>'}async function poll(){if(!session||busy)return;busy=true;let e=epoch;try{let s=await api('state');if(e===epoch)render(s)}catch(e){$('err').textContent=e.message}finally{busy=false}}function hand(v){return {rock:'✊ 石头',scissors:'✌️ 剪刀',paper:'✋ 布'}[v]||''}
let ctx, musicOn=localStorage.getItem('duelMusic')==='1',fxOn=localStorage.getItem('duelFx')!=='0',musicTimer,beat=0,lastSec=-1;
function initAudio(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}catch{}}
function tone(f,d=.12,vol=.045,delay=0){if(!ctx||ctx.state!=='running')return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.01)}
function notes(a){if(fxOn)a.forEach((f,i)=>tone(f,.17,.055,i*.12))}
function audioLabels(){$('music').textContent='音乐：'+(musicOn?'开':'关');$('fx').textContent='音效：'+(fxOn?'开':'关')}
function toggleAudio(which){initAudio();if(which==='music'){musicOn=!musicOn;localStorage.setItem('duelMusic',musicOn?'1':'0')}else{fxOn=!fxOn;localStorage.setItem('duelFx',fxOn?'1':'0')}audioLabels()}
document.addEventListener('click',e=>{initAudio();if(e.target.closest('button'))notes([660])});audioLabels();
setInterval(()=>{if(!musicOn||document.hidden)return;let seq=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,246.94,293.66,392,293.66,261.63,329.63,392,523.25];tone(seq[beat%seq.length],.65,.018);if(beat%4===0)tone(seq[beat%seq.length]/2,.85,.012);beat++},520);
function audioUpdate(s,old){if(!old){lastSec=-1;return}if(s.players.length>old.players.length)notes([523,659,784]);if(s.phase!==old.phase){if(s.phase==='end')notes(s.winner===s.me?[523,659,784,1047]:[440,349,262]);else if(s.phase==='rps')notes([392,523,392,659]);else if(s.phase==='play')notes([523,784]);}else if(s.phase==='play'&&s.turn===s.me&&old.turn!==s.turn)notes([660,880]);if(s.history.length>old.history.length){let h=s.history.at(-1);if(h[1]===null)notes([220]);else if(h[2]===s.players[s.me].size)notes([523,659,784]);else if(h[0]===s.me)notes([440+h[2]*35]);}let sec=Math.ceil(s.remaining);if(s.phase==='play'&&s.turn===s.me&&sec<=5&&sec>0&&sec!==lastSec)notes([880]);lastSec=sec;}
setInterval(poll,500);poll();</script></html>
