<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字对决</title><style>*{box-sizing:border-box}body{margin:0;background:#eff6fc;color:#263b50;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 16px}h1{color:#367acb;margin-bottom:4px}small{color:#70859b}section{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 24px #325d8510}input,button{font:inherit;border-radius:12px;padding:13px;width:100%;margin:6px 0}input{border:1px solid #cbddec;background:#f9fcff}button{border:0;background:#4389df;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#e8f2ff;color:#367acb}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timer{font-size:48px;color:#4389df;text-align:center;font-variant-numeric:tabular-nums}.center{text-align:center}.record{padding:10px 0;border-bottom:1px solid #e9eff5;overflow-wrap:anywhere}.secret{letter-spacing:4px;font-size:24px}.err{color:#b34b4b;min-height:24px}h3{font-size:16px}</style><main><h1>数字对决</h1><small>一点推理，一点运气。</small><section id="home"><input id="nick" maxlength="20" placeholder="你的昵称"><button onclick="enter('create')">创建房间</button><input id="code" inputmode="numeric" maxlength="6" placeholder="六位房间号"><button class="alt" onclick="enter('join')">加入房间</button></section><div id="game" hidden><section><small>房间号</small><h2 id="room"></h2><button class="alt" onclick="share()">复制邀请链接</button><div id="players"></div></section><section id="stage"></section><section id="records" hidden><div class="cols"><div><h3>我的记录</h3><div id="mine"></div></div><div><h3>对方记录</h3><div id="other"></div></div></div></section><button class="alt" onclick="leave()">退出房间</button></div><p class="err" id="err" role="alert"></p></main><script>
const $=id=>document.getElementById(id);let session=JSON.parse(localStorage.getItem('duel')||'null'),state=null,key='',busy=false,epoch=0; $('code').value=new URLSearchParams(location.search).get('room')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,extra={}){let r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,action,...extra})});let j=await r.json();if(j.error)throw Error(j.error);return j}async function enter(action){if(busy)return;busy=true;try{session=await api(action,{name:$('nick').value,code:$('code').value});localStorage.setItem('duel',JSON.stringify(session));key='';}catch(e){$('err').textContent=e.message}finally{busy=false}poll()}async function act(action,value){if(busy)return;busy=true;try{render(await api(action,{value}));$('err').textContent=''}catch(e){$('err').textContent=e.message}finally{busy=false}}function leave(){if(!confirm('退出当前房间？'))return;epoch++;session=null;localStorage.removeItem('duel');location.href=location.pathname}async function share(){let u=new URL(location.href);u.searchParams.set('room',session.code);try{await navigator.clipboard.writeText(u.href);$('err').textContent='邀请链接已复制'}catch{prompt('复制邀请链接',u.href)}}function render(s){state=s;$('home').hidden=true;$('game').hidden=false;$('room').textContent=session.code;$('players').innerHTML=s.players.map((p,i)=>esc(p.name)+(i===s.me?'（我）':'')+' · '+(s.phase==='size'?(p.size??'未选')+' 位':p.ready?'已准备':'未准备')).join('<br>');let p=s.players[s.me],k=[s.phase,s.turn,p.ready,p.again,p.size,s.players.length].join('|');if(k!==key){key=k;let h='';if(s.phase==='size')h='<h2>选择数字位数</h2><p>双方选择一致后开始设置谜底。</p><input id="value" type="number" min="1" max="12" value="'+(p.size||4)+'"><button onclick="act(\'size\',$(\'value\').value)">确认位数</button>';if(s.phase==='secret')h=p.ready?'<h2>等待对方准备</h2>':'<h2>设置你的秘密数字</h2><input id="value" inputmode="numeric" maxlength="'+p.size+'" autocomplete="off" placeholder="输入 '+p.size+' 位数字"><button onclick="act(\'secret\',$(\'value\').value)">锁定谜底</button>';if(s.phase==='play')h='<div class="timer" id="timer"></div><h2 class="center">'+(s.turn===s.me?'轮到你猜啦！':'等待对方猜测')+'</h2>'+(s.turn===s.me?'<input id="value" inputmode="numeric" autocomplete="off" maxlength="'+p.size+'" placeholder="输入 '+p.size+' 位数字"><button onclick="act(\'guess\',$(\'value\').value)">提交猜测</button>':'');if(s.phase==='end')h='<h2>'+ (s.winner===s.me?'🎉 你赢啦！':'本局对方获胜')+'</h2>'+s.players.map(q=>'<p>'+esc(q.name)+'：'+esc(q.secret)+'</p>').join('')+'<button '+(p.again?'disabled':'')+' onclick="act(\'again\')">'+(p.again?'等待对方':'再来一局')+'</button>';if(p.secret&&s.phase!=='end')h+='<p><small>我的秘密数字</small></p><div class="secret">'+esc(p.secret)+'</div>';$('stage').innerHTML=h}if($('timer'))$('timer').textContent=Math.ceil(s.remaining)+' 秒';$('records').hidden=!['play','end'].includes(s.phase);for(let i=0;i<2;i++)$(i===s.me?'mine':'other').innerHTML=s.history.filter(x=>x[0]===i).map((x,j)=>'<div class="record">'+(j+1)+'. '+(x[1]===null?'超时 · 跳过':esc(x[1])+' · '+x[2]+' 位正确')+'</div>').join('')||'<small>暂无记录</small>'}async function poll(){if(!session||busy)return;busy=true;let e=epoch;try{let s=await api('state');if(e===epoch)render(s)}catch(e){$('err').textContent=e.message}finally{busy=false}}setInterval(poll,500);poll();</script></html>
