<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字对决</title><style>*{box-sizing:border-box}body{margin:0;background:#eff6fc;color:#263b50;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 16px}h1{color:#367acb;margin-bottom:4px}small{color:#70859b}section{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 24px #325d8510}input,button{font:inherit;border-radius:12px;padding:13px;width:100%;margin:6px 0}input{border:1px solid #cbddec;background:#f9fcff}button{border:0;background:#4389df;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#e8f2ff;color:#367acb}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timer{font-size:48px;color:#4389df;text-align:center;font-variant-numeric:tabular-nums}.center{text-align:center}.record{padding:10px 0;border-bottom:1px solid #e9eff5;overflow-wrap:anywhere}.secret{letter-spacing:4px;font-size:24px}.err{color:#b34b4b;min-height:24px}h3{font-size:16px}
:root{--ink:#615b70;--blue:#7896b5;--pink:#e8cbd3;--paper:#fffdf8}body{background:radial-gradient(ellipse at 0 0,#f5e4e9,transparent 45%),radial-gradient(ellipse at 100% 30%,#dceaf2,transparent 55%),#f8f4ed;color:var(--ink);font-family:system-ui,sans-serif}main{padding:18px 16px 32px}h1{color:#687f9c;font-size:30px;letter-spacing:3px;margin:0}h2{font-size:21px;color:#69677d}small{color:#827e90}section{background:var(--paper);border:2px solid #e9e1df;border-radius:26px;box-shadow:0 5px 0 #e5dce555;padding:19px}input{background:#faf8f6;border:2px solid #e7dfe5;color:var(--ink);outline:none}input:focus{border-color:#91aec5}button{background:#7896b5;border-radius:18px;box-shadow:0 3px 0 #5e7d9b;color:white;transition:transform .15s}button:active{transform:translateY(2px);box-shadow:none}button.alt{background:#eee5ee;color:#776a83;box-shadow:0 3px 0 #ddd0e0}.hero{text-align:center;padding:8px 0 12px}.hero svg{width:100%;max-width:330px;height:auto;display:block;margin:auto}.eyebrow{font-size:11px;letter-spacing:3px;color:#93859b;font-weight:bold}.timer{width:126px;height:126px;border:8px solid #dce8ef;border-radius:50%;display:grid;place-items:center;margin:4px auto;color:#7896b5;background:#f5f9fa;font-size:30px}.timer.urgent{border-color:#e8c4c9;color:#a55d6e}.record{background:#f3edf3;border:0;border-radius:12px;margin:7px 0;padding:10px;font-size:14px}#other .record{background:#eaf1f5}.secret{background:#f5eee3;border:2px dashed #e4d4bf;border-radius:14px;padding:12px;text-align:center;overflow-wrap:anywhere}#players{line-height:1.9}#room{letter-spacing:5px;margin:8px 0}.rps{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rps button{padding:16px 3px;background:#b39db9;box-shadow:0 3px 0 #96829d}.win{animation:pop .5s ease-out;text-align:center;background:#f7ecd6;border-radius:18px;padding:15px}.win:before{content:'✦  ★  ✧';display:block;color:#b69a61;font-size:25px}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><main><div class="hero"><div class="eyebrow"> LITTLE NUMBER CLUB </div><svg viewBox="0 0 330 120" xmlns="http://www.w3.org/2000/svg" aria-label="米奇、凯蒂猫、玉桂狗卡通装饰" role="img"><g fill="#d9c5a0"><path d="M16 35l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/><path d="M310 14l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><g stroke="#635b65" stroke-width="2.5" stroke-linejoin="round"><g transform="translate(62 63)"><circle cx="-27" cy="-28" r="22" fill="#77717c"/><circle cx="27" cy="-28" r="22" fill="#77717c"/><circle r="35" fill="#77717c"/><path d="M-27 4Q-34-29-12-27Q0-27 0-12Q0-27 13-27Q35-29 27 4Q39 29 0 31Q-39 29-27 4" fill="#f6dfc8"/><ellipse cx="-8" cy="-7" rx="3" ry="7" fill="#635b65"/><ellipse cx="8" cy="-7" rx="3" ry="7" fill="#635b65"/><ellipse cy="5" rx="7" ry="4" fill="#635b65"/><path d="M-10 15Q0 24 10 15" fill="none"/></g><g transform="translate(165 62)"><path d="M-37-8L-37-37Q-35-44-12-29Q0-32 12-29Q35-44 37-37L37-8Q52 35 0 35Q-52 35-37-8" fill="#fffdf9"/><g fill="#635b65"><ellipse cx="-15" cy="8" rx="3" ry="5"/><ellipse cx="15" cy="8" rx="3" ry="5"/></g><ellipse cy="15" rx="5" ry="3" fill="#e5c582"/><path d="M-32 5l-13-4m13 12l-14 1m14 7l-12 5M32 5l13-4m-13 12l14 1m-14 7l12 5" fill="none"/><path d="M24-26Q4-47 4-25Q4-8 24-19Q44-5 44-25Q44-45 24-26" fill="#dcaebd"/><circle cx="24" cy="-23" r="6" fill="#dcaebd"/></g><g transform="translate(267 66)" stroke="#849db3"><path d="M-25-17Q-57-35-52-8Q-49 10-30 9M25-17Q57-35 52-8Q49 10 30 9" fill="#fffdf9"/><ellipse rx="35" ry="29" fill="#fffdf9"/><ellipse cx="-13" cy="1" rx="3" ry="5" fill="#849db3"/><ellipse cx="13" cy="1" rx="3" ry="5" fill="#849db3"/><path d="M-6 11Q-3 16 0 11Q3 16 6 11" fill="none"/><ellipse cx="-22" cy="10" rx="6" ry="3" fill="#e8cbd3" stroke="none"/><ellipse cx="22" cy="10" rx="6" ry="3" fill="#e8cbd3" stroke="none"/></g></g></svg><h1>数字对决</h1><small>和喜欢的人，一起猜猜心里的数字 ♡</small></div><div class="cols"><button class="alt" id="music" onclick="toggleAudio('music')">音乐：关</button><button class="alt" id="fx" onclick="toggleAudio('fx')">音效：开</button></div><section id="home"><input id="nick" maxlength="20" placeholder="你的昵称"><button onclick="enter('create')">创建房间</button><input id="code" inputmode="numeric" maxlength="6" placeholder="六位房间号"><button class="alt" onclick="enter('join')">加入房间</button></section><div id="game" hidden><section><small>房间号</small><h2 id="room"></h2><button class="alt" onclick="share()">复制邀请链接</button><div id="players"></div></section><section id="stage"></section><section id="records" hidden><div class="cols"><div><h3>我的记录</h3><div id="mine"></div></div><div><h3>对方记录</h3><div id="other"></div></div></div></section><button class="alt" onclick="leave()">退出房间</button></div><p class="err" id="err" role="alert"></p></main><script>
const $=id=>document.getElementById(id);let session=JSON.parse(localStorage.getItem('duel')||'null'),state=null,key='',busy=false,epoch=0; $('code').value=new URLSearchParams(location.search).get('room')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,extra={}){let r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,action,...extra})});let j=await r.json();if(j.error)throw Error(j.error);return j}async function enter(action){if(busy)return;busy=true;try{session=await api(action,{name:$('nick').value,code:$('code').value});localStorage.setItem('duel',JSON.stringify(session));key='';}catch(e){$('err').textContent=e.message}finally{busy=false}poll()}async function act(action,value){if(busy)return;busy=true;try{render(await api(action,{value}));$('err').textContent=''}catch(e){$('err').textContent=e.message}finally{busy=false}}function leave(){if(!confirm('退出当前房间？'))return;epoch++;session=null;localStorage.removeItem('duel');location.href=location.pathname}async function share(){let u=new URL(location.href);u.searchParams.set('room',session.code);try{await navigator.clipboard.writeText(u.href);$('err').textContent='邀请链接已复制'}catch{prompt('复制邀请链接',u.href)}}function render(s){audioUpdate(s,state);state=s;$('home').hidden=true;$('game').hidden=false;$('room').textContent=session.code;$('players').innerHTML=s.players.map((p,i)=>esc(p.name)+(i===s.me?'（我）':'')+' · '+(s.phase==='size'?(p.size??'未选')+' 位':p.ready?'已准备':'未准备')).join('<br>');let p=s.players[s.me],k=[s.phase,s.turn,p.ready,p.again,p.size,s.players.length,s.rps_round,s.rps_ready,s.pending_hit,s.history.length].join('|');if(k!==key){key=k;let h='';if(s.phase==='size')h='<h2>选择数字位数</h2><p>双方选择一致后开始设置谜底。</p><input id="value" type="number" min="1" max="12" value="'+(p.size||4)+'"><button onclick="act(\'size\',$(\'value\').value)">确认位数</button>';if(s.phase==='secret')h=p.ready?'<h2>等待对方准备</h2>':'<h2>设置你的秘密数字</h2><input id="value" inputmode="numeric" maxlength="'+p.size+'" autocomplete="off" placeholder="输入 '+p.size+' 位数字"><button onclick="act(\'secret\',$(\'value\').value)">锁定谜底</button>';if(s.phase==='play')h='<div class="timer" id="timer"></div><h2 class="center">'+(s.turn===s.me?'轮到你猜啦！':'等待对方猜测')+'</h2>'+(s.turn===s.me?'<input id="value" inputmode="numeric" autocomplete="off" maxlength="'+p.size+'" placeholder="输入 '+p.size+' 位数字"><button onclick="act(\'guess\',$(\'value\').value)">提交猜测</button>':'');if(s.phase==='rps')h='<h2>石头剪刀布 · 第 '+s.rps_round+' 局</h2><p>双方同轮猜中！秘密出拳，平局重赛。</p>'+ (s.rps_last?'<p>上局平局：'+hand(s.rps_last[0])+'</p>':'')+(s.rps_ready?'<p>等待对方出拳…</p>':'<div class="cols rps">'+['rock','scissors','paper'].map(v=>'<button onclick="act(\'rps\',\''+v+'\')">'+hand(v)+'</button>').join('')+'</div>');if(s.phase==='play'&&s.pending_hit)h+='<p>先手已猜中，等待后手完成本轮。</p>';if(s.phase==='end')h='<h2 class="win">'+ (s.winner===s.me?'🎉 你赢啦！':'本局对方获胜')+'</h2>'+s.players.map(q=>'<p>'+esc(q.name)+'：'+esc(q.secret)+'</p>').join('')+(s.rps_last?'<p>决胜出拳：'+s.players.map((q,i)=>esc(q.name)+' '+hand(s.rps_last[i])).join(' · ')+'</p>':'')+'<button '+(p.again?'disabled':'')+' onclick="act(\'again\')">'+(p.again?'等待对方':'再来一局')+'</button>';if(p.secret&&s.phase!=='end')h+='<p><small>我的秘密数字</small></p><div class="secret">'+esc(p.secret)+'</div>';$('stage').innerHTML=h}if($('timer')){$('timer').textContent=Math.ceil(s.remaining)+' 秒';$('timer').classList.toggle('urgent',s.remaining<=5);}$('records').hidden=!['play','rps','end'].includes(s.phase);for(let i=0;i<2;i++)$(i===s.me?'mine':'other').innerHTML=s.history.filter(x=>x[0]===i).map((x,j)=>'<div class="record">'+(j+1)+'. '+(x[1]===null?'超时 · 跳过':esc(x[1])+' · '+x[2]+' 位正确')+'</div>').join('')||'<small>暂无记录</small>'}async function poll(){if(!session||busy)return;busy=true;let e=epoch;try{let s=await api('state');if(e===epoch)render(s)}catch(e){$('err').textContent=e.message}finally{busy=false}}function hand(v){return {rock:'✊ 石头',scissors:'✌️ 剪刀',paper:'✋ 布'}[v]||''}
let ctx, musicOn=localStorage.getItem('duelMusic')==='1',fxOn=localStorage.getItem('duelFx')!=='0',musicTimer,beat=0,lastSec=-1;
function initAudio(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}catch{}}
function tone(f,d=.12,vol=.045,delay=0){if(!ctx||ctx.state!=='running')return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.min(vol*3,0.85),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.01)}
function notes(a){if(fxOn)a.forEach((f,i)=>tone(f,.17,.055,i*.12))}
function audioLabels(){$('music').textContent='音乐：'+(musicOn?'开':'关');$('fx').textContent='音效：'+(fxOn?'开':'关')}
function toggleAudio(which){initAudio();if(which==='music'){musicOn=!musicOn;localStorage.setItem('duelMusic',musicOn?'1':'0')}else{fxOn=!fxOn;localStorage.setItem('duelFx',fxOn?'1':'0')}audioLabels()}
document.addEventListener('click',e=>{initAudio();if(e.target.closest('button'))notes([660])});audioLabels();
setInterval(()=>{if(!musicOn||document.hidden)return;let seq=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,246.94,293.66,392,293.66,261.63,329.63,392,523.25];tone(seq[beat%seq.length],.65,.018);if(beat%4===0)tone(seq[beat%seq.length]/2,.85,.012);beat++},520);
function audioUpdate(s,old){if(!old){lastSec=-1;return}if(s.players.length>old.players.length)notes([523,659,784]);if(s.phase!==old.phase){if(s.phase==='end')notes(s.winner===s.me?[523,659,784,1047]:[440,349,262]);else if(s.phase==='rps')notes([392,523,392,659]);else if(s.phase==='play')notes([523,784]);}else if(s.phase==='play'&&s.turn===s.me&&old.turn!==s.turn)notes([660,880]);if(s.history.length>old.history.length){let h=s.history.at(-1);if(h[1]===null)notes([220]);else if(h[2]===s.players[s.me].size)notes([523,659,784]);else if(h[0]===s.me)notes([440+h[2]*35]);}let sec=Math.ceil(s.remaining);if(s.phase==='play'&&s.turn===s.me&&sec<=5&&sec>0&&sec!==lastSec)notes([880]);lastSec=sec;}
setInterval(poll,500);poll();</script></html>
